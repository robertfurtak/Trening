name: Ceny test
on:
  push:
    branches: [claude/project-thread-at4ftv]
    paths: ['ceny/scraper/**', '.github/workflows/ceny-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node ceny/scraper/scrape.mjs out.json && head -c 3000 out.json
